# Despliegue con Docker: el entorno queda fijo por el Dockerfile.
services:
  - type: web
    name: conjointlab
    runtime: docker
    plan: free            # cámbialo a "starter" (~$7/mes) para que no se duerma
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: conjoint-db
          property: connectionString

databases:
  - name: conjoint-db
    plan: free            # la base free de Render se elimina a los 90 días
